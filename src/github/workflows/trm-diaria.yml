name: TRM Diaria — Análisis y Envío de Correo

on:
  schedule:
    # 6:00 AM hora Colombia = 11:00 AM UTC (Colombia es UTC-5)
    - cron: '0 11 * * 1-5'   # Lunes a viernes
  workflow_dispatch:           # También permite ejecutarlo manualmente

jobs:
  analizar-y-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: 📊 Ejecutar análisis TRM y enviar correo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CORREO_ORIGEN:     ${{ secrets.CORREO_ORIGEN }}
          CORREO_DESTINO:    ${{ secrets.CORREO_DESTINO }}
          GMAIL_APP_PASS:    ${{ secrets.GMAIL_APP_PASS }}
        run: python src/analizar_trm.py
